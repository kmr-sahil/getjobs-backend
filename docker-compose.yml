version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: jobboard_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobadmin
      POSTGRES_PASSWORD: jobadmin123
      POSTGRES_DB: jobboard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
